name: tickscan
description: "TickScan — znajdź kleszcze na sierści zwierzęcia za pomocą filtrów kamery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  camera: ^0.11.0
  shared_preferences: ^2.3.0
  purchases_flutter: ^8.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.0
  gallery_saver_plus: ^3.2.0
  package_info_plus: ^8.0.0

dev_dependencies:
  # flutter_launcher_icons: ^0.14.0  # Only needed for icon generation
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
