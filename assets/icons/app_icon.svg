<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Magnifying glass -->
  <circle cx="440" cy="420" r="180" fill="none" stroke="white" stroke-width="48"/>
  <line x1="580" y1="560" x2="750" y2="730" stroke="white" stroke-width="48" stroke-linecap="round"/>
  <!-- Simplified tick (arachnid) inside glass -->
  <ellipse cx="440" cy="400" rx="60" ry="80" fill="#FF8F00"/>
  <circle cx="440" cy="310" r="30" fill="#FF8F00"/>
  <!-- Legs -->
  <line x1="400" y1="340" x2="340" y2="300" stroke="#FF8F00" stroke-width="12" stroke-linecap="round"/>
  <line x1="480" y1="340" x2="540" y2="300" stroke="#FF8F00" stroke-width="12" stroke-linecap="round"/>
  <line x1="390" y1="400" x2="310" y2="390" stroke="#FF8F00" stroke-width="12" stroke-linecap="round"/>
  <line x1="490" y1="400" x2="570" y2="390" stroke="#FF8F00" stroke-width="12" stroke-linecap="round"/>
  <line x1="400" y1="460" x2="320" y2="490" stroke="#FF8F00" stroke-width="12" stroke-linecap="round"/>
  <line x1="480" y1="460" x2="560" y2="490" stroke="#FF8F00" stroke-width="12" stroke-linecap="round"/>
</svg>